[build-system]
requires = ["cython", "setuptools"]
build-backend = 'setuptools.build_meta'

[project]
name = 'bgen'
version = '1.10.0'
description = 'Package for loading data from bgen files'
readme = 'README.md'
license = 'MIT'
requires-python = '>=3.9'
authors = [
    {name = "Jeremy McRae", email = 'jmcrae@illumina.com'},
]

dependencies = [
    'numpy',
]

classifiers = [
    'Development Status :: 4 - Beta',
    'Topic :: Scientific/Engineering :: Bio-Informatics',
]

[tool.setuptools]
packages = [
    'bgen',
]

[tool.setuptools.package-data]
bgen = [
    'py.typed',
    '*.pyi',
]

[project.urls]
homepage = 'https://github.com/jeremymcrae/bgen'
